<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Road Rush</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #111;
    overflow: hidden;
    font-family: Arial, sans-serif;
    user-select: none;
}

#game {
    display: block;
    margin: auto;
    background: #333;
    max-width: 100vw;
    max-height: 100vh;
}

#ui {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 22px;
    font-weight: bold;
    z-index: 5;
}

#gameOver {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(0,0,0,.75);
    color: white;
    z-index: 10;
}

#gameOver h1 {
    font-size: 45px;
    color: #ff3333;
}

#gameOver p {
    font-size: 22px;
    margin: 10px;
}

button {
    border: none;
    padding: 14px 28px;
    border-radius: 10px;
    background: #ff3333;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.controls {
    position: fixed;
    bottom: 25px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-around;
    z-index: 6;
}

.controls button {
    width: 90px;
    height: 60px;
    font-size: 30px;
    background: rgba(255,255,255,.2);
}
</style>
</head>

<body>

<div id="ui">
    Score: <span id="score">0</span>
</div>

<canvas id="game" width="400" height="700"></canvas>

<div class="controls">
    <button id="left">⬅️</button>
    <button id="right">➡️</button>
</div>

<div id="gameOver">
    <h1>💥 CRASH!</h1>
    <p>Your Score: <span id="finalScore">0</span></p>
    <button onclick="restartGame()">PLAY AGAIN</button>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player;
let enemies = [];
let score = 0;
let speed = 5;
let roadLineY = 0;
let gameRunning = true;

const keys = {
    left: false,
    right: false
};

function resetPlayer() {
    player = {
        x: 175,
        y: 580,
        width: 50,
        height: 90,
        speed: 7
    };
}

resetPlayer();

function drawRoad() {

    // Grass
    ctx.fillStyle = "#16802b";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Road
    ctx.fillStyle = "#333";
    ctx.fillRect(70, 0, 260, canvas.height);

    // Road edges
    ctx.fillStyle = "#fff";
    ctx.fillRect(70, 0, 6, canvas.height);
    ctx.fillRect(324, 0, 6, canvas.height);

    // Center lines
    ctx.fillStyle = "#fff";

    for (let y = -40; y < canvas.height; y += 80) {
        ctx.fillRect(
            197,
            y + roadLineY,
            6,
            40
        );
    }

    roadLineY += speed;

    if (roadLineY >= 80)
        roadLineY = 0;
}

function drawCar(car, color) {

    // Main body
    ctx.fillStyle = color;
    ctx.fillRect(
        car.x,
        car.y,
        car.width,
        car.height
    );

    // Roof
    ctx.fillStyle = "#111";
    ctx.fillRect(
        car.x + 8,
        car.y + 15,
        car.width - 16,
        35
    );

    // Windows
    ctx.fillStyle = "#58c7ff";
    ctx.fillRect(
        car.x + 12,
        car.y + 20,
        car.width - 24,
        25
    );

    // Wheels
    ctx.fillStyle = "#050505";

    ctx.fillRect(
        car.x - 5,
        car.y + 15,
        7,
        22
    );

    ctx.fillRect(
        car.x + car.width - 2,
        car.y + 15,
        7,
        22
    );

    ctx.fillRect(
        car.x - 5,
        car.y + 60,
        7,
        22
    );

    ctx.fillRect(
        car.x + car.width - 2,
        car.y + 60,
        7,
        22
    );
}

function spawnEnemy() {

    const lanes = [100, 175, 250];

    const lane =
        lanes[Math.floor(Math.random() * lanes.length)];

    enemies.push({
        x: lane,
        y: -100,
        width: 50,
        height: 90,
        speed: speed + Math.random() * 2,
        color: randomColor()
    });
}

function randomColor() {

    const colors = [
        "#ff3333",
        "#ffaa00",
        "#00aaff",
        "#cc33ff",
        "#ffffff"
    ];

    return colors[
        Math.floor(Math.random() * colors.length)
    ];
}

function collision(a, b) {

    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}

function update() {

    if (!gameRunning) return;

    // Player movement
    if (keys.left)
        player.x -= player.speed;

    if (keys.right)
        player.x += player.speed;

    // Road boundaries
    if (player.x < 76)
        player.x = 76;

    if (player.x + player.width > 324)
        player.x = 324 - player.width;

    // Enemy movement
    enemies.forEach(enemy => {
        enemy.y += enemy.speed;

        if (collision(player, enemy)) {
            endGame();
        }
    });

    // Remove enemies
    enemies = enemies.filter(enemy => {
        if (enemy.y > canvas.height) {
            score++;
            document.getElementById("score").innerText = score;

            if (score % 10 === 0)
                speed +=
